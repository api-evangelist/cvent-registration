apis:
- aid: cvent-registration:rest-api
  name: Cvent Registration REST API
  description: >-
    The Cvent Registration REST API is the registration surface of the unified Cvent Platform REST API.
    It allows integrations to create and manage events, registration types, fees, sessions, contacts,
    attendees, registrations, payments, and travel data. Authentication uses OAuth 2.0 client credentials
    with the token endpoint at api-platform.cvent.com/ea/oauth2/token. Detailed registration workflows
    are documented in the Registration Guide.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Attendees
  - Contacts
  - Events
  - OAuth 2.0
  - Payments
  - Registration
  - REST
  - Sessions
  - Ticketing
