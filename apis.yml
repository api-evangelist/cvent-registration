- aid: cvent-registration:cvent-registration-bulk-api
  name: Cvent Registration Bulk API
  description: >-
    The Bulk API provides a simple interface to upload large amounts of data into Cvent.  The API processes
    the uploaded data asynchronously making API calls on behalf of the caller.


    Consumers of the bulk API will do the following:

    * [Create a bulk job](#operation/createBulkJob) with or without data

    * *(Optional)* If a bulk job was created without data, then [upload bulk job data](#operation/uploadBulkJobData)
    as many times as needed

    * *(Optional)* [Run bulk job](#operation/runBulkJob)

    * Use [get bulk job](#operation/getBulkJobById) to track status

    * Use [list bulk job results](#operation/listBulkJobResult) to get details of items uploaded


    For more details, see the [Bulk Job User Guide](https://developers.cvent.com/docs/rest-api/guides/bulk-api-user-guide).


    **Note:** These bulk jobs have a TTL and will expire once they are complete or never ran. Bulk jobs
    will expire

    1 week after creation, and this one week is refreshed when data is uploaded and the job is run. The
    Bulk Job

    will be available for 1 week after completion to get results. Right now we do NOT support bulk GET
    requests.
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Bulk
  properties:
  - type: OpenAPI
    url: openapi/cvent-registration-bulk-api-openapi.yml
