- aid: cvent-registration:cvent-registration-card-tokens-api
  name: Cvent Registration Card Tokens API
  description: >-
    **Card Tokenization**: Tokenization is the process Cvent uses to collect sensitive card details and

    personally identifiable information (PII), directly from your customers in a secure manner.

    This guarantees that no sensitive card data touches your server, and allows your integration to

    operate in compliance with PCI standards. A card token is a unique identifier that represents sensitive
    credit card information.

    It is used as a secure alternative to directly handling credit card details during transactions.

    The token can be used in place of the actual credit card data when making API calls, providing an
    extra layer of security.
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Card Tokens
  properties:
  - type: OpenAPI
