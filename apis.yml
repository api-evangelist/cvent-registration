- aid: cvent-registration:cvent-registration-appointments-api
  name: Cvent Registration Appointments API
  description: >-
    An appointment is a meeting scheduled between two or more parties. These APIs allow you to get
     information about your Cvent Appointments: appointment attendees, their interests, and availabilities.


    * **Appointment Events** - Appointment events help planners facilitate meetings between attendees.
    Attendees express their interest and availability to schedule appointments. Use this API to get information
    about appointments and appointment attendees.


    * **Appointment Attendees** - Appointment attendees are meeting participants. They can be attendees
    of either events or appointment events. Get information about these participants or use their appointment
    attendee ID to get their availabilities and interests.


    * **Availability** - Appointment availabilities describe an appointment attendees' preference in meeting
    dates and times. Availability information is only available for *Planner Coordinated Appointments*.


    * **Interests** - Appointment interests describe appointment attendees' preferences in meeting with
    another organization or individual. Interest information is only available for *Planner Coordinated
    Appointments*.

    * **Available Times** - Available times lists time ranges available  for appointments scheduling.

    * **Locations** - Locations lists details of all locations created for  scheduling appointments.

    * **Appointment Types** - Appointment Types lists details of different  appointment types created.
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Appointments
  properties:
  - type: OpenAPI
    url: openapi/cvent-registration-appointments-api-openapi.yml
- aid: cvent-registration:cvent-registration-attendee-insights-api
  name: Cvent Registration Attendee Insights API
  description: >-
    The Attendee Insights feature provides valuable information about your event attendees. It assists
    planners, marketers, and exhibitors in targeting customers effectively, thereby enhancing engagement
    and conversion rates for marketing campaigns. Utilize these APIs to fetch engagement score data from
    your event and integrate it into your marketing systems.


    **Engagement Score** - Engagement scores are a container that track individual attendees' engagement
    with your event. Attendees earn points by performing actions, which indicates their relative engagement
    with your content.


    **Actions** - These are distinct, trackable activities that attendees can perform during an event.
    Points are awarded for these actions and contribute to the engagement score.
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Attendee Insights
  properties:
  - type: OpenAPI
    url: openapi/cvent-registration-attendee-insights-api-openapi.yml
