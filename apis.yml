  - type: ChangeLog
    url: https://developers.cvent.com/docs/rest-api/changelog
- aid: cvent-registration:webhooks
  name: Cvent Registration Webhooks
  description: >-
    Cvent Webhooks deliver real-time push notifications when registration, attendee, session, and meeting
    request events occur in Cvent. Webhook subscribers receive event payloads at a configured URL, enabling
    reactive integration with CRM, marketing automation, data warehouses, and analytics without polling
    the REST API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/webhooks/overview
