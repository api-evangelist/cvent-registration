- aid: cvent-registration:cvent-registration-housing-api
  name: Cvent Registration Housing API
  description: >-
    RegLink APIs allow you to exchange data with Cvent Passkey events and hotel reservation-booking engines.

    Generally, there are four primary categories of functionality that RegLink APIs support:
      * **Sync Registrants.** Allow individual registrant information to be sent to Cvent Passkey, streamlining
    the hotel reservation process for attendees. Attendees can then be directed to Passkey post-registration
    and reserve a hotel room without re-entering their data again. This is done with the reservation request
    endpoint.
      * **Fetch Rooms.** The ability for an external system to fetch Passkey event details and hotel room
    availability based on various criteria.
      * **Fetch Reservations.** The ability for an external system to fetch detailed reservation information
    for individual registrants. This is done with the Reservation endpoint and the Callback system.
      * **Manage Reservations.** The ability for an external system to create, modify or cancel a registrant's
    hotel reservation directly or indirectly.

    If you need authentication credentials or have any questions regarding the RegLink APIs, contact the
    [Cvent Passkey Integrations Team](https://web.cvent.com/survey/c6a60a30-d981-4ae8-af28-686af0eeb9b7/welcome).


    * **Passkey.** A software solution allowing your invitees to book room reservations directly with
    hotels.

    * **Housing Event.** An Passkey event where invitees will be able to register and book rooms.

    * **Reservation Request.** Represents a request to book rooms in the housing event.

    * **RegLink.** A feature that links Passkey events to your registration events, enabling you to sync
    data between the two events.

    * **Callback.** [Passkey's callback system](https://developers.cvent.com/docs/passkey/REST/callbacks)
    allows for a push notification to be sent to your system when a reservation is created, modified or
    cancelled.
  humanURL: https://developers.cvent.com/docs/rest-api/guides/registration-guide
  baseURL: https://api-platform.cvent.com
  tags:
  - Housing
  properties:
  - type: OpenAPI
    url: openapi/cvent-registration-housing-api-openapi.yml
