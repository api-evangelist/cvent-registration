description: >-
  Cvent publishes NO first-party MCP server. Searched the cvent GitHub organisation (100 most
  recently pushed repos), the developer portal route index (every /docs/* page in the Next.js
  build manifest), npm and the web on 2026-09-07 — nothing. Every "Cvent MCP server" that exists
  is third-party: a community server by cmcintosh, CData's read-only JDBC-backed server, and
  Zapier's hosted MCP. None is operated or endorsed by Cvent, so none is recorded as a Cvent
  agent surface. The tool list below is a CANDIDATE derived from real operationIds in Cvent's own
  contract; it is a design proposal, not something an agent can call today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
  note: >-
    mode is `none` because nobody ships a Cvent MCP server. Auth is recorded as oauth because any
    server would have to carry the platform's OAuth 2.0 client-credentials token, not because a
    server exists to authenticate against.
