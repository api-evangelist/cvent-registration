caveats:
  - Every candidate tool inherits the backing operation's OAuth scope; a server must request scopes narrowly.
  - There is no idempotency mechanism, so a retrying agent can double-register an attendee. See conventions/.
  - 429 is ambiguous (throttle vs daily quota) and carries no Retry-After.
