- title: REST API Updates (August 19–20, 2026)
  date: '2026-08-20'
  sections: [New APIs, New Tags, Updated]
  breaking: false
  additions: true
  highlights:
    - New Orders surface — list orders for an account, get an order, list order items, get an order item.
    - New Transactions surface — list transactions for an account, get a transaction, list transaction items, get a transaction item.
    - Meeting-room images — associate an image with a meeting room, list images for a meeting room, remove an image.
    - AttendeeStatus schema description updated to document "Pending Approval -> Cancelled" as a supported status transition.
    - Attendee Messages supported-type description expanded (session chats, exhibitor chats, text discussions, 1:1 attendee messaging, group messaging).
    - housing-event-hotel schema gains reservationAccessDate, a reservation close date, and a rewardPrograms array.
    - PolicyValueType gains a boolean enum value.
- title: REST API Updates (August 5–6, 2026)
  date: '2026-08-06'
  sections: [Updated]
  breaking: false
  additions: false
  highlights:
    - BudgetVendor vendor.type now includes REPOSITE, indicating a vendor sourced from Reposite.
    - air-actual-detail response documents minItems 0 on the air actuals array.
    - RfpRequest gains an optional preferredVenueIntegrations array (maxItems 1) of VenueIntegrationType.
    - New business-transient/bids:read OAuth2 scope alongside business-transient/proposals:read.
