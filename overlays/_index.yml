description: >-
  OpenAPI Overlay 1.0.0 documents PUBLISHED BY CVENT, saved verbatim. These are not our
  enhancements — Cvent authors them in its SDK monorepo and applies them in .speakeasy/workflow.yaml
  on top of cvent-public-spec/openapi.yaml before generating the TypeScript, Java and C# SDKs.
  Files are byte-identical to the provider's; provenance is recorded here rather than in
  frontmatter so the overlays themselves stay unmodified.
