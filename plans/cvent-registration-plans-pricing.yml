created: '2026-05-04'
modified: '2026-09-07'
plan_count: 5
description: >-
  Cvent publishes NO prices. The pricing page names two commercial licence tiers — Professional
  and Enterprise — and every call to action on it is "Get pricing" / "Get a free quote"; there is
  no self-serve checkout, no list price, and no per-call rate card anywhere on cvent.com. The one
  quantified, published tiering that touches the API is the platform's three REST usage tiers
  (Free / Standard / Premium), whose daily quota, per-second rate and burst are stated in Cvent's
  own OpenAPI. Both are recorded below; the commercial tiers carry price: null on purpose.
  This replaces the 2026-05-04 scaffold, whose Free/Professional/Enterprise quotas were invented.
notes:
  - >-
    API ACCESS IS AN ENTERPRISE FEATURE. "API access" is listed only in the Enterprise column of
    the pricing page, alongside SSO, MFA and the Registration / Attendee Hub / OnArrival licences.
    Professional does not list it.
  - >-
    The former pricing pointer https://www.cvent.com/en/pricing is a confirmed 404; the live page
    is /en/event-management-software/cvent-pricing.
